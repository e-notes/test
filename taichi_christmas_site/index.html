<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102b39"><title>TAICHI Christmas English Practice</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#173044;background:#f3f7f8}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:22px 18px 80px}header{background:#102f3e;color:white;border-radius:22px;padding:25px;margin-bottom:20px}h1{font-size:clamp(25px,5vw,38px);margin:0 0 8px}.sub{color:#c8e4e8;font-size:15px}.panel{background:white;border-radius:20px;padding:18px;box-shadow:0 4px 18px #14334410;margin:16px 0}.label{font-size:13px;font-weight:700;color:#517084;letter-spacing:.06em}.line{font-size:clamp(27px,5.5vw,42px);line-height:1.38;font-weight:750;margin:16px 0;min-height:115px}.jp{font-size:18px;line-height:1.5;color:#526878;margin:12px 0}.role{font-weight:700;color:#087c8a}.controls{display:flex;flex-wrap:wrap;gap:10px;margin-top:15px}button{border:0;border-radius:14px;padding:15px 17px;font-size:17px;font-weight:700;background:#e8f1f4;color:#173044;cursor:pointer;touch-action:manipulation}button.primary{background:#087d88;color:white;flex:1}button:disabled{opacity:.45}.settings{display:flex;flex-wrap:wrap;gap:16px;align-items:center}.settings label{display:flex;gap:8px;align-items:center}select{font-size:16px;padding:9px;border:1px solid #c8d7df;border-radius:10px;background:white}input[type=checkbox]{width:20px;height:20px;accent-color:#087d88}.items{display:grid;gap:9px}.item{text-align:left;width:100%;display:block;border:2px solid transparent;background:#f4f7f8;padding:13px 14px;border-radius:12px;font-size:17px;font-weight:500;line-height:1.4}.item.active{border-color:#087d88;background:#e5f6f4}.item small{display:block;font-size:12px;font-weight:700;color:#4e7282;margin-bottom:5px}.foot{font-size:13px;color:#617888;line-height:1.7}#status{min-height:22px;font-size:14px;color:#476b7b} .progress{height:7px;border-radius:8px;background:#dce9ed;overflow:hidden;margin-top:16px}.bar{height:100%;background:#10a19a;width:12.5%;transition:width .2s}
</style></head><body><main class="wrap"><header><div class="sub">🎄 Christmas Concert · English Practice</div><h1>TAICHI の セリフれんしゅう</h1><div class="sub">えいごを きいて、いっしょに よんでみよう！</div></header>
<section class="panel"><div class="label" id="counter">1 / 8</div><div class="progress"><div class="bar" id="bar"></div></div><p class="role" id="role"></p><div class="line" id="english"></div><div class="jp" id="japanese"></div><div id="status" aria-live="polite"></div><div class="controls"><button id="prev" aria-label="前のセリフ">◀ まえ</button><button id="play" class="primary">▶ きく</button><button id="next" aria-label="次のセリフ">つぎ ▶</button></div><div class="controls"><button id="all">▶ ぜんぶ きく</button><button id="stop">■ とめる</button><button id="repeat">↻ この文を 3かい</button></div></section>
<section class="panel"><div class="settings"><label>よむ はやさ <select id="speed"><option value="0.65">ゆっくり</option><option value="0.8" selected>すこし ゆっくり</option><option value="1">ふつう</option><option value="1.15">はやめ</option></select></label><label><input type="checkbox" id="showjp" checked>にほんごを みる</label><label><input type="checkbox" id="autonext">1文のあと つぎへ</label></div></section>
<section class="panel"><div class="label">セリフを えらぶ</div><div class="items" id="items"></div></section><p class="foot">※ iPad の Safari で「きく」をタップすると、端末の英語読み上げ音声が流れます。音声の声質は端末の設定によって異なります。音が出ない場合は音量を確認し、Safariで開いてください。ホーム画面に追加するとアプリのように使えます。</p></main>
<script>
const data=[
['Alien (All-1)','Who will be chosen on this Christmas day?','このクリスマスの日に、だれが選ばれるのかな？'],
['Alien (All-2)','Oh no, we need to find those presents soon!','たいへん！ はやくプレゼントを見つけなきゃ！'],
['Alien (2-1)','You guys have some great moves!','みんな、すごくいい動きをするね！'],
['Alien (2-2)',"It’s so big... And heavy looking!",'とっても大きい……それに重そう！'],
['Alien (2-3)','Andy will wake up very soon!','アンディがもうすぐ起きちゃうよ！'],
['Alien (2-4)','Yea, it would get all wet!','うん、全部ぬれちゃうよ！'],
['Alien (All-3)',"You are the last present, aren’t you?!",'きみが最後のプレゼントだよね？！'],
['Alien (All-4)',"We have time. Don’t worry!",'まだ時間はあるよ。心配しないで！']
];
let current=0,session=0,voices=[];const $=id=>document.getElementById(id);const synth=window.speechSynthesis;
function chooseVoice(){voices=synth?.getVoices()||[];return voices.find(v=>v.lang==='en-US'&&/Samantha|Ava|Allison|Susan/i.test(v.name))||voices.find(v=>v.lang==='en-US')||voices.find(v=>v.lang.startsWith('en'))||null}
function render(){const [role,en,jp]=data[current];$('counter').textContent=`${current+1} / ${data.length}`;$('bar').style.width=`${(current+1)/data.length*100}%`;$('role').textContent=role;$('english').textContent=en;$('japanese').textContent=jp;$('japanese').hidden=!$('showjp').checked;$('prev').disabled=current===0;$('next').disabled=current===data.length-1;document.querySelectorAll('.item').forEach((e,i)=>{e.classList.toggle('active',i===current);e.setAttribute('aria-current',i===current?'true':'false')})}
function cancel(){session++;if(synth)synth.cancel();$('status').textContent=''}
function select(i){cancel();current=i;render()}
function speakOnce(i,token){return new Promise(resolve=>{if(token!==session||!synth){resolve(false);return}const u=new SpeechSynthesisUtterance(data[i][1]);u.lang='en-US';u.rate=Number($('speed').value);const voice=chooseVoice();if(voice)u.voice=voice;let finished=false;function done(ok){if(finished)return;finished=true;resolve(ok)}u.onend=()=>done(true);u.onerror=()=>done(false);$('status').textContent='🔊 よみあげています…';synth.speak(u)})}
async function run(mode){cancel();const token=session;if(!synth){$('status').textContent='このブラウザは音声読み上げに対応していません。Safariで開いてください。';return}const start=current;const count=mode==='repeat'?3:1;const end=mode==='all'?data.length:start+1;for(let i=start;i<end;i++){if(token!==session)return;current=i;render();for(let k=0;k<count;k++){if(token!==session)return;const ok=await speakOnce(i,token);if(!ok||token!==session)return;if(k<count-1)$('status').textContent=`${k+1} / ${count} かい`}if(mode==='single'&&$('autonext').checked&&i<data.length-1){current=i+1;render()}}if(token===session)$('status').textContent='✓ おわり！ よくがんばったね！'}
$('items').innerHTML=data.map((d,i)=>`<button class="item" data-i="${i}"><small>${i+1}. ${d[0]}</small>${d[1]}</button>`).join('');document.querySelectorAll('.item').forEach(e=>e.onclick=()=>select(Number(e.dataset.i)));
$('play').onclick=()=>run('single');$('all').onclick=()=>run('all');$('repeat').onclick=()=>run('repeat');$('stop').onclick=cancel;$('prev').onclick=()=>select(Math.max(0,current-1));$('next').onclick=()=>select(Math.min(data.length-1,current+1));$('showjp').onchange=render;$('speed').onchange=cancel;if(synth&&'onvoiceschanged'in synth)synth.onvoiceschanged=()=>{voices=synth.getVoices()};render();
</script></body></html>
